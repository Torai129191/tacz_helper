plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_id: mod_id, mod_version: mod_version]
    filteringCharset = 'UTF-8'
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---- 建築ボトル1000個ぶんのアイテムモデルをビルド時に自動生成 ----
// （GitHubのアップロードが1回100ファイルまでなので、自動で作る）
def bottleShapes = ['house', 'tower', 'sniper', 'wall', 'pyramid', 'bridge', 'deck', 'bunker', 'arena', 'castle', 'cottage', 'mushroom', 'pagoda', 'torii', 'dome', 'lighthouse', 'treehouse', 'camp', 'rocket', 'ufo', 'slide', 'jumppark', 'maze', 'traproom', 'fountain']
def bottlePalettes = ['oak', 'spruce', 'birch', 'jungle', 'acacia', 'darkoak', 'mangrove', 'cherry', 'bamboo', 'crimson', 'warped', 'cobble', 'mossy', 'stonebrick', 'brick', 'sand', 'redsand', 'quartz', 'prismarine', 'deepslate', 'blackstone', 'netherbrick', 'endstone', 'obsidian', 'mud', 'white', 'pink', 'red', 'orange', 'yellow', 'lime', 'green', 'cyan', 'lightblue', 'blue', 'purple', 'magenta', 'gray', 'black', 'gold']
def generatedAssets = layout.buildDirectory.dir('generated/bottle-assets').get().asFile

tasks.register('generateBottleAssets') {
    outputs.dir(generatedAssets)
    doLast {
        def itemDir = new File(generatedAssets, 'assets/taczhelper/models/item')
        itemDir.mkdirs()
        bottleShapes.each { shapeId ->
            bottlePalettes.each { palId ->
                def id = "bottle_${shapeId}_${palId}"
                new File(itemDir, id + '.json').setText('{"parent":"minecraft:item/generated","textures":{"layer0":"taczhelper:item/bottle_body","layer1":"taczhelper:item/shape_' + shapeId + '"}}', 'UTF-8')
            }
        }
    }
}

sourceSets.main.resources.srcDir generatedAssets
tasks.named('processResources').configure { dependsOn 'generateBottleAssets' }
